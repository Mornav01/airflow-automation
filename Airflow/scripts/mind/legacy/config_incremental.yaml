# ── Source & Destination Databases ──────────────────────────────────
source_db:
  type: mssql
  host: localhost
  port: 1435
  database: Primerecord_diff_merged
  username: ${SOURCE_USER}
  password: ${SOURCE_PW}

destination_db:
  type: mysql
  host: localhost
  port: 3306
  database: deidentified_staging
  username: ${DEST_USER}
  password: ${DEST_PW}

mappings_db:
  type: mysql
  host: localhost
  port: 3306
  database: mapping_pg
  username: ${DEST_USER}
  password: ${DEST_PW}

join_db:
  type: mssql
  host: localhost
  port: 1435
  database: Primerecord_base_03152026
  username: ${SOURCE_USER}
  password: ${SOURCE_PW}

# ── Namespace Key ────────────────────────────────────────────────────
config_key: incremental

# ── State Storage ────────────────────────────────────────────────────
#state_db_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/deid_runtime/state/state.db
#failed_rows_db_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/deid_runtime/state/failed_rows.db
# .deid_staging/ is auto-placed next to state.db (same folder)

state_db_url: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/deid_state"
failed_rows_db_url: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/deid_failed"

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://localhost:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 20000
  date_offset_days: 30
  patient_id_prefix: 10000000
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/Airflow/scripts/configs/mind_config_rules.csv

# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patientid
    destination_column: nd_patient_id
    identifier_columns:
      - patientid   # update to match actual columns in patient_mapping_table
  encounter:
    source_column: encounter_id
    destination_column: nd_encounter_id
    reference: patient

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 2
  processors: 8
  max_retries: 1
  task_timeout: 3600
  table_batch_size: 5   # 5 tables at a time → max 7 workers

# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/deid_runtime/logs/incremental

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master_pg"
  secondary_pii_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master_pg"

secondary_pii_config_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/Airflow/scripts/configs/mind/mind_secondary_pii_config.yaml

pii_config_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/Airflow/scripts/configs/mind/mind_pii_config.yaml

# ── Reference Mapping Joins ───────────────────────────────────────────
reference_mappings_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/Airflow/scripts/configs/greenway_reference_mappings.yaml


# ── Per-Table Overrides ───────────────────────────────────────────────
#table_overrides_path: /Users/ndai/Desktop/Air_DEID_V2/airflow-automation/Airflow/scripts/configs/mind/table_overrides.yaml
