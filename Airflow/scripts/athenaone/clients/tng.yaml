# Per-practice pipeline config for the tng (AthenaOne) practice.
# Loaded at DAG parse time via PRACTICE_NAME=tng in .env.
# All values can still be overridden per-run in the Airflow UI.

# Skip bringing the OpenVPN tunnel up/down around the pull (set true on a
# machine with no tunnel, or one that stays permanently connected).
skip_vpn: false
# Skip the Snowflake ingestion (e.g. when re-running downstream only).
skip_ingest: false
# Stop after ingestion, before mapping/master + deid.
stop_after_ingest: false

# Deid parallelism (shared task defaults).
deid_init_max_workers: 16
deid_status_max_workers: 8
deid_merge_max_workers: 8
deid_delete_max_workers: 8

# S3 transfer parser workers (null => transfer script default).
parser_workers: null
