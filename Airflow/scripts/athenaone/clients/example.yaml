# Per-practice pipeline config for AthenaOne (TEMPLATE).
# Copy to <practice>.yaml and set PRACTICE_NAME=<practice> in .env — the DAG
# loads scripts/athenaone/clients/<PRACTICE_NAME>.yaml at parse time and uses
# these as param defaults (all still overridable per-run in the Airflow UI).
#
# AthenaOne has no restore/daily_dump/diff_merge, so the eCW/Greenway
# skip_restore / stop_after_diff_merge flags do not apply. The relevant knobs:

# Skip the Snowflake ingestion (e.g. when re-running downstream only).
skip_ingest: false
# Stop after ingestion, before mapping/master + deid.
stop_after_ingest: false

# Deid parallelism (shared task defaults).
deid_init_max_workers: 16
deid_status_max_workers: 8
deid_merge_max_workers: 8
deid_delete_max_workers: 8

# S3 transfer parser workers (null ⇒ transfer script default).
parser_workers: null
