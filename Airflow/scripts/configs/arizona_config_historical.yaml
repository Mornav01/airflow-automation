# ── Source & Destination Databases ──────────────────────────────────
source_db:
  type: ${SOURCE_DB_TYPE}
  host: 127.0.0.1
  port: 1437
  database: mobiledoc_base_0601
  username: ${SOURCE_DB_USER}
  password: ${SOURCE_DB_PASS}

destination_db:
  type: mysql
  host: localhost
  port: 3306
  database: deidentified_mobiledoc_base
  username: ${DB_USER}
  password: ${DB_PASS}

mappings_db:
  type: mysql
  host: localhost
  port: 3306
  database: mapping_latest
  username: ${DB_USER}
  password: ${DB_PASS}

# ── Namespace Key ────────────────────────────────────────────────────
config_key: historical

# ── State Storage ────────────────────────────────────────────────────
state_db_path: ${LOG_DIR}/state.db
failed_rows_db_path: ${LOG_DIR}/failed_rows.db
state_db_name: deid_state
failed_rows_db_name: deid_failed
# .deid_staging/ is auto-placed next to state.db (same folder)

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://localhost:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 100000
  date_offset_days: ${DATE_OFFSET}
  patient_id_prefix: 10000000
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: ${RULES_CSV}

# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patientid
    destination_column: nd_patient_id
    identifier_columns:
      - patientid   # update to match actual columns in patient_mapping_table
  encounter:
    source_column: encounter_id
    destination_column: nd_encounter_id
    reference: patient

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 4
  processors: 6
  max_retries: 1
  task_timeout: 3600
  table_batch_size: 5   # 5 tables at a time → max 7 workers

# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: ${LOG_DIR}/historical

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_db_name: ${MASTER_DB_NAME}
  secondary_pii_db_name: ${MASTER_DB_NAME}

secondary_pii_config_path: ${SECONDARY_PII_YAML}

pii_config_path: ${PII_YAML}

# ── Reference Mapping Joins ───────────────────────────────────────────
reference_mappings_path: ${REF_MAPPING_YAML}
