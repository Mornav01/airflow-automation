regex:
  ssn:
    masking_value: ((SSN))
    processing_func: null
    regex:
    - \b\d{3}[- ]\d{2}[- ]\d{4}\b
  uemail:
    masking_value: ((EMAIL))
    processing_func: null
    regex:
    - \b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b
  upPhone:
    masking_value: ((PHONENUMBER))
    processing_func: null
    regex:
    - \(\d{3}\)\s*\d{3}-\d{4}
    - \b\d{3}-\d{3}-\d{4}\b
    - \+\d{1,3}\s\d{1,4}[- ]\d{3}[- ]\d{4}\b
    - \b\d{3} \d{3} \d{4}\b
  upagerno:
    masking_value: ((PHONENUMBER))
    processing_func: null
    regex:
    - \(\d{3}\)\s*\d{3}-\d{4}
    - \b\d{3}-\d{3}-\d{4}\b
    - \+\d{1,3}\s\d{1,4}[- ]\d{3}[- ]\d{4}\b
    - \b\d{3} \d{3} \d{4}\b
  umobileno:
    masking_value: ((PHONENUMBER))
