regex:
  Person_SSN:
    masking_value: "((SSN))"
    regex:
      - '\b\d{3}[- ]\d{2}[- ]\d{4}\b'
  Person_Pager:
    masking_value: "((PAGER_NO))"
    regex:
      - '\(\d{3}\)\s*\d{3}-\d{4}'
