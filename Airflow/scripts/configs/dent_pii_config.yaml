# Per-client facility redactions — supplied from env as a JSON list of
# {old_value, new_value} dicts (varies per eCW client). Set REPLACE_VALUE_JSON
# in Airflow/.env on each machine; an example is in .env.example.
replace_value: ${REPLACE_VALUE_JSON}