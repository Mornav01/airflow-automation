regex:
  users_ssn:
    masking_value: "((SSN))"
    regex:
      - "\\b\\d{3}[- ]\\d{2}[- ]\\d{4}\\b"
  users_uemail:
    masking_value: "((EMAIL))"
    regex:
      - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
  users_upPhone:
    masking_value: "((PHONENUMBER))"
    regex: &phone_regex
      - "\\(\\d{3}\\)\\s*\\d{3}-\\d{4}"
      - "\\b\\d{3}-\\d{3}-\\d{4}\\b"
      - "\\+\\d{1,3}\\s\\d{1,4}[- ]\\d{3}[- ]\\d{4}\\b"
      - "\\b\\d{3} \\d{3} \\d{4}\\b"
  users_upagerno:
    masking_value: "((PHONENUMBER))"
    regex: *phone_regex
  users_umobileno:
    masking_value: "((PHONENUMBER))"
    regex: *phone_regex
  patients_employerPhone:
    masking_value: "((PHONENUMBER))"
    regex: *phone_regex
  patients_insgroupno:
    masking_value: "((PATIENT_INSURANCE))"
    regex: *phone_regex
  patients_inssubscriberno:
    masking_value: "((PATIENT_INSURANCE))"
    regex: *phone_regex
  # Complex Address Regex Mapping
  # users_upaddress:
  #   masking_value: "((PATIENT_ADDRESS))"
