# ── Source & Destination Databases ──────────────────────────────────
source_db:
  type: mysql
  host: localhost
  port: 3306
  database: veradigm
  username: $(SOURCE_USER)
  password: ${SOURCE_PW}

destination_db:
  type: mysql
  host: localhost
  port: 3306
  database: deidentified_base
  username: ${DEST_USER}
  password: ${DEST_PW}

mappings_db:
  type: mysql
  host: localhost
  port: 3306
  database: mapping
  username: ${DEST_USER}
  password: ${DEST_PW}

# ── Namespace Key ────────────────────────────────────────────────────
config_key: historical

# ── State Storage ────────────────────────────────────────────────────
#state_db_path: /Users/ndainoran/airflow_latest/airflow-automation/deid_runtime/state.db
#failed_rows_db_path: /Users/ndainoran/airflow_latest/airflow-automation/deid_runtime/failed_rows.db
# .deid_staging/ is auto-placed next to state.db (same folder)

state_db_url: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/deid_state"
failed_rows_db_url: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/deid_failed"

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://localhost:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 50000
  date_offset_days: 34
  patient_id_prefix: 10010015
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: /Users/ndaiasheville/Documents/airflow/airflow-automation/Airflow/scripts/configs/phi_rules_v2.csv
# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patientid
    destination_column: nd_patient_id
    identifier_columns:
      - patientid   # update to match actual columns in patient_mapping_table
  encounter:
    source_column: encounter_id
    destination_column: nd_encounter_id
    reference: patient

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 2
  processors: 16
  max_retries: 1
  task_timeout: 3600
  table_batch_size: 5   # 5 tables at a time → max 7 workers


# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: /Users/ndaiasheville/Documents/airflow/airflow-automation/deid_runtime/logs/historical

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master"
#  secondary_pii_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master_prod"

#secondary_pii_config_path: /Users/ndaiasheville/Documents/airflow/airflow-automation/Airflow/scripts/configs/secondary_pii_config_v2.yaml

pii_config_path: /Users/ndaiasheville/Documents/airflow/airflow-automation/Airflow/scripts/configs/ashville/pii_config_ashville.yaml

# ── Reference Mapping Joins ───────────────────────────────────────────
reference_mappings_path: /Users/ndaiasheville/Documents/airflow/airflow-automation/Airflow/scripts/configs/ashville/reference_mapping_ashville.yaml


# ── Per-Table Overrides ───────────────────────────────────────────────
