# ── Source & Destination Databases ──────────────────────────────────
# Source is MySQL (primerecord_bin) — clinicalbin_decrypted_staging
# lives in MySQL, unlike the main MSSQL → MySQL pipeline.
source_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${CLINICALBIN_DB_NAME}
  username: ${DB_USER}
  password: ${DB_PASS}

destination_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${DEID_STAGING_NAME}
  username: ${DB_USER}
  password: ${DB_PASS}

mappings_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${MAPPING_DB_NAME}
  username: ${DB_USER}
  password: ${DB_PASS}

# ── Namespace Key ────────────────────────────────────────────────────
# Separate key so state.db entries don't collide with the main incremental run.
config_key: clinicalbin_incremental

# ── State Storage ────────────────────────────────────────────────────
state_db_path: ${LOG_DIR}/clinicalbin_state.db
failed_rows_db_path: ${LOG_DIR}/clinicalbin_failed_rows.db
state_db_name: deid_state
failed_rows_db_name: deid_failed

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://${DB_HOST}:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 50000
  date_offset_days: ${DATE_OFFSET}
  patient_id_prefix: 10000000
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: ${CNOTES_RULES_CSV}

# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patientid
    destination_column: nd_patient_id
    identifier_columns:
      - patientid   # update to match actual columns in patient_mapping_table

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 1
  processors: 4
  max_retries: 1
  task_timeout: 3600
  table_batch_size: 5   # 5 tables at a time → max 7 workers

# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: ${LOG_DIR}/clinicalbin

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_db_name: ${MASTER_DB_NAME}
  secondary_pii_db_name: ${MASTER_DB_NAME}

secondary_pii_config_path: ${SECONDARY_PII_YAML}
pii_config_path: ${PII_YAML}
reference_mappings_path: ${REF_MAPPING_YAML}
