# ── Source & Destination Databases ──────────────────────────────────
source_db:
  type: mssql
  host: 127.0.0.1
  port: 1433
  database: Primerecord_latest
  username: ${SOURCE_USER}
  password: ${SOURCE_PW}

destination_db:
  type: mysql
  host: localhost
  port: 3306
  database: test_deid
  username: ${DEST_USER}
  password: ${DEST_PW}

mappings_db:
  type: mysql
  host: localhost
  port: 3306
  database: mapping
  username: ${DEST_USER}
  password: ${DEST_PW}

# ── Namespace Key ────────────────────────────────────────────────────
config_key: historical

# ── State Storage ────────────────────────────────────────────────────
state_db_path: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/deid_runtime/state.db
failed_rows_db_path: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/deid_runtime/failed_rows.db
# .deid_staging/ is auto-placed next to state.db (same folder)

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://localhost:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 100000
  date_offset_days: 34
  patient_id_prefix: 10000000
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/Airflow/scripts/configs/jwm_config_rules.csv

# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patient_id
    destination_column: nd_patient_id
  encounter:
    source_column: encounter_id
    destination_column: nd_encounter_id
    reference: patient

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 2
  processors: 16
  max_retries: 1
  task_timeout: 3600


# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/state/deidentification/logs/historical

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master"
  secondary_pii_connection_str: "mysql+pymysql://${DEST_USER}:${DEST_PW}@localhost:3306/master"

secondary_pii_config_path: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/Airflow/scripts/configs/jwm_secondary_pii_config.yaml

pii_config_path: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/Airflow/scripts/configs/jwm_pii_config.yaml

# ── Reference Mapping Joins ───────────────────────────────────────────
reference_mappings_path: /Users/ndaijwm/Desktop/airflow_incremental/airflow-automation/Airflow/scripts/configs/greenway_reference_mappings.yaml