# ── Source & Destination Databases ──────────────────────────────────
# Source engine is client-specific: mysql or mssql, driven by SOURCE_DB_TYPE.
# All source connection primitives come from the SOURCE_DB_* family, set per
# machine in .env. SOURCE_DB_HOST falls back to DB_HOST when the source is local.
#   mysql → SOURCE_DB_PORT=3306 ; mssql → SOURCE_DB_PORT=1433
# destination/mappings/join stay MySQL (DB_*) below.
source_db:
  type: ${SOURCE_DB_TYPE}
  host: ${SOURCE_DB_HOST}
  port: ${SOURCE_DB_PORT}
  database: ${STAGING_SCHEMA}
  username: ${SOURCE_DB_USER}
  password: ${SOURCE_DB_PASS}

destination_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${DEID_STAGING_NAME}
  username: ${DB_USER}
  password: ${DB_PASS}

mappings_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${MAPPING_DB_NAME}
  username: ${DB_USER}
  password: ${DB_PASS}

join_db:
  type: mysql
  host: ${DB_HOST}
  port: ${DB_PORT}
  database: ${PROD_SCHEMA}
  username: ${DB_USER}
  password: ${DB_PASS}

# ── Namespace Key ────────────────────────────────────────────────────
config_key: incremental

# ── State Storage ────────────────────────────────────────────────────
state_db_path: ${LOG_DIR}/state.db
failed_rows_db_path: ${LOG_DIR}/failed_rows.db

# ── Redis ────────────────────────────────────────────────────────────
redis_url: redis://localhost:6379/0

# ── De-Identification Settings ───────────────────────────────────────
deidentification:
  batch_size: 100000
  date_offset_days: 34
  patient_id_prefix: 10000000
  random_seed: 42

# ── Tables & Rules ───────────────────────────────────────────────────
rules_csv: ${RULES_CSV}

# ── Mapping Tables ───────────────────────────────────────────────────
mapping_tables:
  patient:
    source_column: patient_id
    destination_column: nd_patient_id
  encounter:
    source_column: encounter_id
    destination_column: nd_encounter_id
    reference: patient

# ── Pipeline Phases ──────────────────────────────────────────────────
phases:
  - setup
  - deidentify

# ── Worker Settings ──────────────────────────────────────────────────
workers:
  fetchers: 3
  processors: 5
  max_retries: 1
  task_timeout: 3600

# ── Logging ──────────────────────────────────────────────────────────
logging:
  log_dir: ${LOG_DIR}/incremental

# ── Quality Control ──────────────────────────────────────────────────
qc:
  sample_size: 100
  scan_for_residual_pii: true

# ── PII / Notes Config ───────────────────────────────────────────────
pii_db:
  master_connection_str: "mysql+pymysql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${MASTER_DB_NAME}"
  secondary_pii_connection_str: "mysql+pymysql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${MASTER_DB_NAME}"

secondary_pii_config_path: ${SECONDARY_PII_YAML}

pii_config_path: ${PII_YAML}

# ── Reference Mapping Joins ───────────────────────────────────────────
reference_mappings_path: ${REF_MAPPING_YAML}
